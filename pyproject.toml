[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kol-thesis"
version = "1.0.0"
description = "Physics-informed fault-location experiments for the master thesis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "hydra-core==1.3.2", "omegaconf==2.3.0", "numpy==2.4.2",
  "pandas==3.0.0", "torch==2.10.0", "scikit-learn==1.8.0"
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.10", "seaborn>=0.13", "pyarrow>=19"]
notebooks = ["jupyterlab>=4", "nbformat>=5"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
kol-print-config = "KOL.cli.print_config:main"
kol-validate = "KOL.cli.validate:main"

[tool.setuptools.packages.find]
include = ["KOL*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

