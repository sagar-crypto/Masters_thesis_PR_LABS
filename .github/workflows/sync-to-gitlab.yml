name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push GitHub main to GitLab sync branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@git5.cs.fau.de/si69koni/fault-localization-using-known-operator-learning.git

          git push gitlab HEAD:refs/heads/github-sync --force-with-lease
